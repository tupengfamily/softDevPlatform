# ===========================================
# Spring Boot 管理系统 配置
# ===========================================

# 应用基本信息
app:
  name: Spring Boot 管理系统
  version: 2.0.0
  author: Java 学习者
  cors:
    # 允许的前端开发源(逗号分隔白名单; 生产环境改为实际域名,禁止 *)
    allowed-origins: http://localhost:5173,http://localhost:5174,http://[::1]:5173,http://[::1]:5174
  # 操作日志保留天数(默认 7 天,超期自动清理; <=0 表示永久保留)
  log-retention-days: 7
  # 是否信任反向代理的 X-Forwarded-For / X-Real-IP(默认关闭, 防 IP 伪造)
  trust-proxy: false
  sandbox:
    # 游客可运行沙箱开关(默认关闭: 沙箱执行接口一律需要登录; 为 true 时放行 /api/sandbox/run-*, reset-sql 仍需登录)
    allow-guest-run: false

# 服务端口
server:
  port: 8080
  servlet:
    context-path: /

# Spring 配置
spring:
  application:
    name: spring-boot-learning

  # 文件上传: 单文件最大 20MB(个人文档导入 .docx/.xlsx/.pptx 可能带图; Wiki 导入另有 10MB 业务校验)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 24MB

  # ============== 数据源(SQLite 文件) ==============
  # 🔴 活动库是 data/sandbox.db —— 这里曾长期写成 data/admin.db(0 字节, 从未被使用)，
  #    真正生效靠启动时命令行覆盖 --spring.datasource.url=... 蒙混过关。
  #    后果：yml 与实际行为不一致，任何不带该参数启动的场合(IDE 直接跑、
  #    Docker 镜像默认启动、CI)都会连到空库 → Hibernate 重建 schema → 数据全丢。
  #    现在配置与实际对齐，并允许用 SPRING_DATASOURCE_URL 覆盖(部署到别的库时用)。
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:${user.dir}/data/sandbox.db}
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    hikari:
      pool-name: MainHikariPool
      # SQLite 文件锁串行写;池太大反而加剧锁竞争。WAL 模式下读可并发,
      # 但写依然是单写,3-5 个连接足够覆盖并发请求(HTTP 线程池共享)
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
      # 连接级 PRAGMA(每个新连接打开时自动执行;Hikari 启动后该字段 sealed,需在 yml 注入)
      # 调优点: WAL 读写并发 / NORMAL 写性能 / 5s 锁重试 / FK 完整性 / 64MB 缓存 / 临时表内存
      connection-init-sql: "PRAGMA journal_mode = WAL; PRAGMA synchronous = NORMAL; PRAGMA busy_timeout = 5000; PRAGMA foreign_keys = ON; PRAGMA cache_size = -64000; PRAGMA temp_store = MEMORY;"

  # ============== JPA 配置 ==============
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update          # 首次启动建表,后续启动保留数据
    # show-sql 仅 dev 启用(prod 由 application-prod.yml 关闭,避免泄漏 schema)
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false         # 关闭 OSIV,避免事务边界混淆
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  # ============== SQL 初始化 ==============
# 注意: 种子数据由 AdminBootstrap (CommandLineRunner) 全权负责,
# 这里不配置 sql.init,避免与 JPA 初始化竞争。

# ============== 沙箱数据源(教学库,独立文件) ==============
sandbox:
  datasource:
    url: jdbc:sqlite:${user.dir}/data/sandbox.db
    driver-class-name: org.sqlite.JDBC
    pool-size: 2    # 沙箱教学库,SQLite 文件锁串行写,2 个连接足够(降低锁竞争)

# ============== JWT 配置 ==============
jwt:
  # Base64 编码的 HMAC-SHA256 密钥(>= 32 字节)
  # 必须通过环境变量 JWT_SECRET 注入;未配置时启动自动生成临时随机密钥并告警(重启后 token 失效)
  secret: "${JWT_SECRET:}"
  expiration-millis: 86400000   # 24 小时
  header: Authorization
  prefix: "Bearer "

# 日志配置
logging:
  level:
    root: INFO
    com.learning.springboot: DEBUG
    org.hibernate.SQL: DEBUG

# ============== OnlyOffice Document Server 集成 ==============
# 总开关: 设 true 后 MyDocuments 编辑器走 OO iframe, 否则走 v5 自绘
# 配套环境变量: OO_URL / OO_INTERNAL_URL / OO_JWT_SECRET / OO_JWT_ENABLED
onlyoffice:
  enabled: ${OO_ENABLED:false}
  url: ${OO_URL:http://localhost:8088}
  internal-url: ${OO_INTERNAL_URL:http://onlyoffice:80}
  jwt-secret: ${OO_JWT_SECRET:}
  jwt-enabled: ${OO_JWT_ENABLED:true}
  jwt-header: ${OO_JWT_HEADER:Authorization}

# ============== 天地图（Tianditu）后端代理 ==============
# 架构：服务端持 key 代调天地图，浏览器只跟本服务说话。
#   - 为什么不让浏览器直连：服务端 key 放前端等于公开；浏览器端 key 直连又拿不到
#     矢量/注记等需要 key 的图层能力，且 key 会出现在 DevTools 里。
#   - 天地图有两种 key：浏览器端 key 在服务端调用会返回 403
#     {"code":301012,"msg":"权限类型错误"}，所以代理层必须用「服务端」类型 key。
#
# ⚠️ 密钥绝不要写进本文件（会随仓库泄露）。只通过环境变量注入：
#   TIANDITU_SERVER_KEY  = 天地图控制台申请的【服务端】key   ← 代理层必填
#   TIANDITU_BROWSER_KEY = 天地图控制台申请的【浏览器端】key（备用，本后端不用）
#   TIANDITU_ENABLED     = true/false 总开关（默认 true）
tianditu:
  enabled: ${TIANDITU_ENABLED:true}
  # 服务端 key：未配置时地图端点返回 503 并提示配置，不去打上游（避免无谓报错）
  server-key: ${TIANDITU_SERVER_KEY:}
  # 浏览器端 key：仅备用字段，代理层不使用
  browser-key: ${TIANDITU_BROWSER_KEY:}
  # API 根地址（地名搜索 / 地理编码）
  base-url: ${TIANDITU_BASE_URL:https://api.tianditu.gov.cn}
  # 瓦片域名模板，{0} 为 0-7 机器编号（天地图共 8 台，代理层按 (x+y)%8 轮询分流）
  tile-host-template: ${TIANDITU_TILE_HOST:https://t{0}.tianditu.gov.cn}
  # 超时（毫秒）：连接 3s / 读取 8s
  connect-timeout-ms: ${TIANDITU_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${TIANDITU_READ_TIMEOUT_MS:8000}
  # 搜索/地理编码结果内存缓存（天地图的行政区划/POI 数据几乎不变，缓存可省上游配额）
  max-cache-entries: ${TIANDITU_MAX_CACHE_ENTRIES:500}
  cache-ttl-ms: ${TIANDITU_CACHE_TTL_MS:1800000}

# ============== 缓存 (Caffeine 本地内存) ==============
# 读多写少的接口(字典/课程树/系统设置)在 service 方法上用 @Cacheable
# 多实例部署需换成 Redis; 单实例 Caffeine 性能最优
spring.cache:
  type: caffeine
  caffeine:
    spec: maximumSize=2000,expireAfterWrite=5m,recordStats
# ============================================================
# 「稼穑」小游戏（/api/games/farm）
# ============================================================
farm:
  # 🔴 演示模式：允许「手动推进天数」与「注入模拟天气」。
  #    正式部署必须设 FARM_DEMO_MODE=false —— 1:1 真实时间下推进时间违反设计基线 D2
  #    （禁止任何形式的时间加速）。平台作为通用学习系统，玩家不会为看一季稻子等 140 天，
  #    所以本地开发默认开启，并在 UI 上如实标注「演示模式」。
  #    ⚠️ Docker/生产部署务必在 compose 的 environment 里显式传 FARM_DEMO_MODE=false，
  #       否则会跟着默认值一起把「推进 400 天」的闸门放开。
  demo-mode: ${FARM_DEMO_MODE:true}
