# ===========================================
# Spring Boot 管理系统 配置
# ===========================================

# 应用基本信息
app:
  name: Spring Boot 管理系统
  version: 2.0.0
  author: Java 学习者
  cors:
    # 允许的前端开发源(逗号分隔白名单; 生产环境改为实际域名,禁止 *)
    allowed-origins: http://localhost:5173,http://localhost:5174,http://[::1]:5173,http://[::1]:5174
  # 操作日志保留天数(默认 7 天,超期自动清理; <=0 表示永久保留)
  log-retention-days: 7
  # 是否信任反向代理的 X-Forwarded-For / X-Real-IP(默认关闭, 防 IP 伪造)
  trust-proxy: false
  sandbox:
    # 游客可运行沙箱开关(默认关闭: 沙箱执行接口一律需要登录; 为 true 时放行 /api/sandbox/run-*, reset-sql 仍需登录)
    allow-guest-run: false

# 服务端口
server:
  port: 8080
  servlet:
    context-path: /

# Spring 配置
spring:
  application:
    name: spring-boot-learning

  # 文件上传(头像等): 单文件最大 2MB
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB

  # ============== 数据源(SQLite 文件) ==============
  datasource:
    url: jdbc:sqlite:${user.dir}/data/admin.db
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    hikari:
      pool-name: AdminHikariPool
      maximum-pool-size: 10      # SQLite 单写多读,不宜过大
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  # ============== JPA 配置 ==============
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update          # 首次启动建表,后续启动保留数据
    show-sql: true              # 打印 SQL
    open-in-view: false         # 关闭 OSIV,避免事务边界混淆
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  # ============== SQL 初始化 ==============
# 注意: 种子数据由 AdminBootstrap (CommandLineRunner) 全权负责,
# 这里不配置 sql.init,避免与 JPA 初始化竞争。

# ============== 沙箱数据源(教学库,独立文件) ==============
sandbox:
  datasource:
    url: jdbc:sqlite:${user.dir}/data/sandbox.db
    driver-class-name: org.sqlite.JDBC
    pool-size: 5

# ============== JWT 配置 ==============
jwt:
  # Base64 编码的 HMAC-SHA256 密钥(>= 32 字节)
  # 必须通过环境变量 JWT_SECRET 注入;未配置时启动自动生成临时随机密钥并告警(重启后 token 失效)
  secret: "${JWT_SECRET:}"
  expiration-millis: 86400000   # 24 小时
  header: Authorization
  prefix: "Bearer "

# 日志配置
logging:
  level:
    root: INFO
    com.learning.springboot: DEBUG
    org.hibernate.SQL: DEBUG